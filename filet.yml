# casier-cli's coding standard, enforced by filet.
# https://github.com/FacileStudio/filet
#
#   filet check .     the rules
#   filet roast .     the rules, with commentary
#   filet test .      the cargo suite
#
# filet has no Rust-specific rule family the way it has `go.*`. What runs here
# is the generic set (`gen.*`) plus the architecture rules, so treat this file
# as a layout contract with a size budget attached, not as a clippy substitute.
# `cargo clippy` still owns anything that needs to understand Rust.

kind: cli

ignore:
  - .git
  - target
  - dist
  - build
  - coverage

extensions: [.rs]

# Only five of filet's limits reach a `.rs` file; the rest (funcLines,
# funcStatements, complexity, structFields, interfaceMethods) are Go-only and
# are left out rather than pinned to numbers that do nothing. funcsPerFile is
# filet's strict default: filet counts `impl` methods as functions, so a module
# holding a few impls plus helpers can exceed it, but the budget still catches a
# file that genuinely declares more than eight top-level items.
limits:
  fileLines: 250
  funcsPerFile: 8
  lineLength: 120
  nesting: 4

# main.rs is the clap entry point and dispatches to src/commands/. Every
# subcommand is one file there; the modules beside it are the pieces those
# commands share.
architecture:
  requiredDirs: [src, src/commands]
  requiredFiles:
    "src": [main.rs, api.rs, config.rs, ui.rs, auth.rs]
    "src/commands": [mod.rs]

# Same story as the limits: requireDocComments, banGlobalMutable and banInit
# only drive `go.*` rules, so they are left out. These three are the toggles a
# `.rs` file is actually measured against.
style:
  banInlineComments: true
  banTODO: true
  banTrailingSpace: true

disabled:
  - gen.line.long   # rustfmt owns line width

failOn: error
