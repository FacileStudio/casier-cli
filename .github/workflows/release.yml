name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.os_name }}/${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        # No linux/arm64. openssl-sys is gone (reqwest is on rustls now), but
        # keyring's sync-secret-service still links libdbus-sys, which needs an
        # aarch64 sysroot with pkg-config. The pure-Rust alternative is
        # async-secret-service, and keyring's own docs warn it deadlocks when
        # called from the main thread under tokio — which is exactly how this
        # CLI calls it. Storing the token in a file instead would drop the C
        # dependency and unblock this target; keeping it in the keychain is the
        # deliberate trade. install.sh falls back to a source build here.
        include:
          - runner: macos-latest
            target: x86_64-apple-darwin
            os_name: darwin
            arch: amd64
          - runner: macos-latest
            target: aarch64-apple-darwin
            os_name: darwin
            arch: arm64
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            os_name: linux
            arch: amd64
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install linux build dependencies
        if: matrix.os_name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libdbus-1-dev

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package
        run: |
          version="${GITHUB_REF_NAME#v}"
          archive="casier_${version}_${{ matrix.os_name }}_${{ matrix.arch }}.tar.gz"
          tar -czf "$archive" -C "target/${{ matrix.target }}/release" casier
          mkdir -p dist
          mv "$archive" dist/

      - uses: actions/upload-artifact@v4
        with:
          name: casier-${{ matrix.os_name }}-${{ matrix.arch }}
          path: dist/*.tar.gz
          retention-days: 1

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd dist
          sha256sum *.tar.gz > checksums.txt
          cat checksums.txt

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            dist/*.tar.gz dist/checksums.txt
